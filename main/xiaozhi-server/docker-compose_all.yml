# Docker安裝全模組
# 必要的部署參數放在同目錄的 .env（不提交 Git），範例見 .env.example。
# 升級前請先閱讀 docs/migration/runbook.md（資料庫備份、密碼、連接埠與回退步驟）。

services:
  # Server模块
  xiaozhi-esp32-server:
    image: xiaozhi-server-sv:no-device-speak-20261123
    build:
      context: ../..
      dockerfile: Dockerfile-server-deps
    container_name: xiaozhi-esp32-server
    depends_on:
      - xiaozhi-esp32-server-db
      - xiaozhi-esp32-server-redis
    restart: always
    networks:
      - default
    ports:
      # 預設只綁定本機，由 xiaozhi-edge-proxy（8002）轉發 WebSocket／視覺分析。
      # 若裝置的 OTA websocket 位址直接指向 :8000，請在 .env 設定 XIAOZHI_BIND_ADDR=0.0.0.0（或特定網卡 IP）。
      # ws服务端
      - "${XIAOZHI_BIND_ADDR:-127.0.0.1}:8000:8000"
      # http服务的端口，用于视觉分析接口
      - "${XIAOZHI_BIND_ADDR:-127.0.0.1}:8003:8003"
    # 已移除 seccomp:unconfined，使用 Docker 預設 seccomp 設定檔
    environment:
      - TZ=Asia/Taipei
    volumes:
      # 配置文件目录
      - ./data:/opt/xiaozhi-esp32-server/data
      # 模型文件挂接（FunASR/SenseVoice；改用 GroqASR/OpenaiASR 且無角色使用 FunASR 後可移除）
      - ./models/SenseVoiceSmall/model.pt:/opt/xiaozhi-esp32-server/models/SenseVoiceSmall/model.pt
      # 原始碼已由 Dockerfile-server-deps 打包進映像，不再逐檔掛載覆寫。
      # 提示詞保留唯讀掛載，方便不重建映像即可調整。
      - ./agent-base-prompt.txt:/opt/xiaozhi-esp32-server/agent-base-prompt.txt:ro

  # manager-api和manager-web模块
  xiaozhi-esp32-server-web:
    image: xiaozhi-server-sv-web:keep-5-sessions-20261123
    build:
      context: ../..
      dockerfile: Dockerfile-web
    container_name: xiaozhi-esp32-server-web
    restart: always
    networks:
      - default
    depends_on:
      xiaozhi-esp32-server-db:
        condition: service_healthy
      xiaozhi-esp32-server-redis:
        condition: service_healthy
    ports:
      # 智控台只提供给本机反向代理；公网入口仍使用 8002
      - "127.0.0.1:18002:8002"
    environment:
      - TZ=Asia/Taipei
      - SPRING_DATASOURCE_DRUID_URL=jdbc:mysql://xiaozhi-esp32-server-db:3306/xiaozhi_esp32_server?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Taipei&nullCatalogMeansCurrent=true&connectTimeout=30000&socketTimeout=30000&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
      - SPRING_DATASOURCE_DRUID_USERNAME=${MYSQL_APP_USER:-root}
      - SPRING_DATASOURCE_DRUID_PASSWORD=${MYSQL_APP_PASSWORD:-${MYSQL_ROOT_PASSWORD:?請在 .env 設定 MYSQL_ROOT_PASSWORD（見 .env.example）}}
      - SPRING_DATA_REDIS_HOST=xiaozhi-esp32-server-redis
      - SPRING_DATA_REDIS_PASSWORD=
      - SPRING_DATA_REDIS_PORT=6379
      # Must be a base64-encoded 32-byte secret supplied by the deployment environment.
      - CODEX_OAUTH_ENCRYPTION_KEY=${CODEX_OAUTH_ENCRYPTION_KEY:-}
    volumes:
      # 配置文件目录
      - ./uploadfile:/uploadfile

  # 统一入口：智控台/OTA 转发到 8002，WebSocket 转发到 8000
  xiaozhi-edge-proxy:
    image: nginx:alpine
    container_name: xiaozhi-edge-proxy
    restart: always
    network_mode: host
    depends_on:
      - xiaozhi-esp32-server
      - xiaozhi-esp32-server-web
    volumes:
      - ./nginx-aiot.conf:/etc/nginx/conf.d/default.conf:ro

  # 数据库模块
  xiaozhi-esp32-server-db:
    image: mysql:26.10.0
    container_name: xiaozhi-esp32-server-db
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      timeout: 45s
      interval: 10s
      retries: 10
    restart: always
    networks:
      - default
    expose:
      - 3306
    volumes:
      - ./mysql/data:/var/lib/mysql
    environment:
      - TZ=Asia/Taipei
      # 只在第一次初始化資料目錄時生效；既有資料庫改密碼請依 runbook 執行 ALTER USER
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?請在 .env 設定 MYSQL_ROOT_PASSWORD（見 .env.example）}
      - MYSQL_DATABASE=xiaozhi_esp32_server
      - MYSQL_INITDB_ARGS="--character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci"
  # redis模块
  xiaozhi-esp32-server-redis:
    image: redis:8-alpine
    expose:
      - 6379
    container_name: xiaozhi-esp32-server-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - default
networks:
  default:
