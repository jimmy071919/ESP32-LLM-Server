# SQLite changelog for this fork.
# 202611230001-baseline.sql is the schema MySQL reached after every changeset in ../changelog
# (generated by tools/mysql_to_sqlite.py). A database migrated from MySQL already has these
# tables, so the precondition marks the baseline as ran instead of re-creating them.
# New schema changes: append a new changeSet with SQLite SQL; never edit an applied one.
databaseChangeLog:
  - changeSet:
      id: 202611230001-sqlite-baseline
      author: jimmy
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: sys_user
      changes:
        - sqlFile:
            encoding: utf8
            path: classpath:db/changelog-sqlite/202611230001-baseline.sql
