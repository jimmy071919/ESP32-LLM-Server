knife4j:
  production: false
  enable: true
  basic:
    enable: false
    username: renren
    password: 2ZABCDEUgF
  setting:
    enableFooter: false
spring:
  datasource:
    druid:
      # SQLite (single file). date_class/date_string_format keep dates as 'yyyy-MM-dd HH:mm:ss' text,
      # the format the MySQL→SQLite migration wrote; busy_timeout waits for a concurrent writer.
      driver-class-name: org.sqlite.JDBC
      url: jdbc:sqlite:/data/xiaozhi.db?journal_mode=WAL&busy_timeout=10000&foreign_keys=false&date_class=TEXT&date_string_format=yyyy-MM-dd HH:mm:ss
      username:
      password:
      initial-size: 1
      max-active: 8
      min-idle: 1
      max-wait: 6000
      validation-query: SELECT 1
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      stat-view-servlet:
        enabled: false
      filter:
        stat:
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: false
        wall:
          config:
            multi-statement-allow: true
  data:
    redis:
      host: 127.0.0.1         # Redis服务器地址
      port: 6379              # Redis服务器连接端口
      password:              # Redis服务器连接密码（默认为空）
      database: 0            # Redis数据库索引（默认为0）
      timeout: 10000ms       # 连接超时时间（毫秒）
      lettuce:
        pool:
          max-active: 8      # 连接池最大连接数（使用负值表示没有限制）
          max-idle: 8        # 连接池中的最大空闲连接
          min-idle: 0        # 连接池中的最小空闲连接
        shutdown-timeout: 100ms  # 客户端优雅关闭的等待时间
